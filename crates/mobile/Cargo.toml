[package]
name = "phantom-mobile"
version = "3.2.2"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "phantom_mobile"
crate-type = ["cdylib"]

[dependencies]
# 引擎与 PC 共用同一份：打洞、STUN、ICE、QUIC 隧道、overlay 加密、抗丢包。
# 这里只写编排（见 src/runtime.rs 的模块注释）。
phantom-core = { path = "../core" }
phantom-protocol = { path = "../protocol" }

jni = "0.21"
once_cell = "1"
parking_lot = "0.12"
quinn = "0.11.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# 需要 full：编排里用到 spawn_blocking（NAT 探测是阻塞的）、
# net（中继地址解析）、sync、time。
tokio = { version = "1", features = ["full"] }
