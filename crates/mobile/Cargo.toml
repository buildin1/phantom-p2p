[package]
name = "phantom-mobile"
version = "3.1.0"
edition = "2021"

[lib]
name = "phantom_mobile"
crate-type = ["cdylib"]

[dependencies]
phantom-core = { path = "../core" }
jni = "0.21"
once_cell = "1"
parking_lot = "0.12"
# 命令载荷与事件都以 JSON 跨 JNI 边界传递，与桌面端/headless 端的 invoke 契约一致
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "time"] }
quinn = "0.11.9"
