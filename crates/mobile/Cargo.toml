[package]
name = "phantom-mobile"
version = "3.0.1"
edition = "2021"

[lib]
name = "phantom_mobile"
crate-type = ["cdylib"]

[dependencies]
phantom-core = { path = "../core" }
jni = "0.21"
once_cell = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "time"] }
quinn = "0.11.9"
