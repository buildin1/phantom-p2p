[package]
name = "phantom-core"
version = "3.2.1"
edition = "2021"

[lib]
name = "phantom_core"

[dependencies]
phantom-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rand = "0.8"
local-ip-address = "0.6"
igd-next = "0.15"
tracing = "0.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
dirs = "6.0.0"
quinn = "0.11.9"
rcgen = "0.14.7"
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
toml = "0.8"
ipnetwork = "0.20"
socket2 = { version = "0.5", features = ["all"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
# 风控自校准库：阈值各地不同、用户无法预先测，只能在每个用户自己的环境里学，
# 而且学到的东西必须跨会话留存。版本与服务端保持一致。
rusqlite = { version = "0.32", features = ["bundled"] }
# overlay 端到端加密：中继只做盲转发，永远看不到明文
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# 日志包上传：打成 zip 便于人工排障时直接解压查看
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
passfd = "0.1"
