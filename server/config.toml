# ============================================================
# 幻梦P2P 服务端配置
# ============================================================

[signal]
# 信令 WebSocket 监听地址
bind = "0.0.0.0"
# 信令端口
port = 10209

[relay]
# 中继服务器公网地址（下发给客户端连接用）
# 部署时改成你的服务器公网 IP 或域名
public_addr = "127.0.0.1"
# 中继端口池范围（单池，按 TCP/UDP 房间动态调度）
port_start = 10113
port_end = 10213
# Token 过期时间（秒）
token_ttl_secs = 120

[port_allocation]
# Guest 本地端口池范围
guest_port_start = 25600
guest_port_end = 25700     # 100 个端口，支持 100 个并发 Guest

[auth]
# 是否启用 Ed25519 鉴权（关闭后所有客户端直接通过）
enabled = true

[admin]
# 是否启用只读管理面板（默认关闭，需要自建者显式开启）
enabled = false
# 管理面板监听地址（默认仅本机可访问；如需公网/内网其它主机访问，
# 请自行改为例如 "0.0.0.0:10210"，并自行负责相应的安全防护，这是你的选择而非默认行为）
bind = "127.0.0.1:10210"
