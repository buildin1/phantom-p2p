# ============================================================
# 幻梦P2P 服务端配置
# ============================================================

[signal]
# 信令 WebSocket 监听地址
bind = "0.0.0.0"
# 信令端口
port = 10209

[relay]
# 中继服务器公网地址（下发给客户端连接用）
# 部署时改成你的服务器公网 IP 或域名
public_addr = "127.0.0.1"
# 中继端口池范围（单池，按 TCP/UDP 房间动态调度）
port_start = 10113
port_end = 10213
# Token 过期时间（秒）
token_ttl_secs = 120

[port_allocation]
# Guest 本地端口池范围
guest_port_start = 25600
guest_port_end = 25700     # 100 个端口，支持 100 个并发 Guest

[auth]
# 是否启用 Ed25519 鉴权（关闭后所有客户端直接通过）
enabled = true
