name: Android (dev)

# 本地没有 Android 构建环境，编译验证全部在这里做。
# 只跑 android-dev 分支：main 上不该出现半成品的移动端提交。
on:
  workflow_dispatch:
  push:
    branches: [android-dev]
    paths:
      - mobile/android/**
      - crates/core/**
      - crates/mobile/**
      - crates/protocol/**
      - version.json
      - official.env
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/android-dev.yml
  pull_request:
    branches: [main]
    paths:
      - mobile/android/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 目前 crates/mobile 的导出面还没重做，先不构建原生库，
  # 让 UI 层的编译错误能独立暴露出来。等 FFI 落地后改成 true。
  BUILD_RUST_NATIVE: "false"

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # 仓库里没有 gradle-wrapper.jar（二进制不入库），所以直接用
      # setup-gradle 提供的 gradle 命令，不走 ./gradlew。
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties

      - name: 准备 Rust 工具链
        if: env.BUILD_RUST_NATIVE == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: 安装 cargo-ndk 与 NDK
        if: env.BUILD_RUST_NATIVE == 'true'
        run: |
          sdkmanager "ndk;27.2.12479018"
          cargo install cargo-ndk --locked

      - name: 编译
        working-directory: mobile/android
        run: |
          gradle --no-daemon \
            assembleDevDebug assembleStandardRelease \
            -Pphantom.buildRustNative=${{ env.BUILD_RUST_NATIVE }} \
            --stacktrace

      - name: 单元测试
        working-directory: mobile/android
        run: gradle --no-daemon testDevDebugUnitTest --stacktrace

      - name: 收集产物
        run: |
          mkdir -p out
          find mobile/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          (cd out && sha256sum *.apk > SHA256SUMS) || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: phantom-android-dev
          path: out/
          if-no-files-found: error
          retention-days: 14
