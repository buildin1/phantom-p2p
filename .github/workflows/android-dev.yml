name: Android (dev)

# 本地没有 Android 构建环境，编译验证全部在这里做。
# 只跑 android-dev 分支：main 上不该出现半成品的移动端提交。
on:
  workflow_dispatch:
  push:
    branches: [android-dev]
    paths:
      - mobile/android/**
      - crates/core/**
      - crates/mobile/**
      - crates/protocol/**
      - version.json
      - official.env
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/android-dev.yml
  pull_request:
    branches: [main]
    paths:
      - mobile/android/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 引擎已接入：必须编 .so 并打进 APK，否则装上去是个空壳
  # （PhantomEngine.ensureLibraryLoaded 会失败，引擎整个不可用）。
  BUILD_RUST_NATIVE: "true"

jobs:
  # Rust 侧独立成 job：core 的改动会影响桌面端，必须先证明 workspace 没被
  # 改坏，再证明 Android target 编得过。两件事任何一件红了，APK 编出来也没意义。
  rust:
    name: Rust 校验
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      # src-web 用 include_str!("../../dist/index.html") 把前端打进二进制，
      # 那是 vite 的产物、不入库。不先构建前端，cargo check 会直接失败。
      # 与 build.yml 的 checks job 保持一致。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: 格式
        run: cargo fmt --all --check

      # 桌面端回归防线：core 里那些钩子在未注册时必须是空操作，
      # 三端行为不能有任何变化。
      # 排除两个：
      #   phantom-p2p     Tauri crate，需要 GUI 依赖（沿用 build.yml 的约定）
      #   phantom-mobile  只为 Android 存在，它引用的 tun_android 接口在
      #                   其它 target 上是 cfg 掉的。它由下面的 cargo-ndk 验。
      - name: workspace 编译（桌面端回归防线）
        run: cargo check --locked --workspace --exclude phantom-p2p --exclude phantom-mobile --all-targets

      - name: 单元测试
        run: cargo test --locked --workspace --exclude phantom-p2p --exclude phantom-mobile

      - uses: android-actions/setup-android@v3

      - name: 安装 NDK 与 cargo-ndk
        run: |
          sdkmanager "ndk;27.2.12479018"
          cargo install cargo-ndk --locked

      # Android target 单独验。这一步才是 crates/mobile 与 tun_android、
      # socket_guard 的 unix 分支唯一被编译的地方 —— 上面的 workspace
      # check 跑在 linux 上，覆盖不到。
      - name: Android target 编译
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: cargo ndk -t arm64-v8a -t armeabi-v7a check -p phantom-mobile --locked

  build:
    name: 编译 APK
    needs: rust
    runs-on: ubuntu-24.04
    env:
      # secrets 上下文在 step 的 if: 里读不到，必须先在 job 级映射成 env。
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

      # 签名参数放 job 级，让所有 gradle 调用都看得到 —— 单元测试任务名
      # （testStandardReleaseUnitTest）里也带 Release，同样会触发签名守卫，
      # 只给「编译」那一步配环境变量是不够的。
      #
      # 路径用相对的：runner.temp 在 job 级 env 里不可用（runner 上下文
      # 只在 step 级可用），而 build.gradle.kts 会用 rootProject.file()
      # 把相对路径解析到 mobile/android/ 下。
      PHANTOM_KEYSTORE_PATH: phantom-release.jks
      PHANTOM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PHANTOM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PHANTOM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # 仓库里没有 gradle-wrapper.jar（二进制不入库），所以直接用
      # setup-gradle 提供的 gradle 命令，不走 ./gradlew。
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties

      - name: 准备 Rust 工具链
        if: env.BUILD_RUST_NATIVE == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: 安装 cargo-ndk 与 NDK
        if: env.BUILD_RUST_NATIVE == 'true'
        run: |
          sdkmanager "ndk;27.2.12479018"
          cargo install cargo-ndk --locked

      # 缺 secrets 就当场停，别让人跑完十分钟才发现产物装不上。
      - name: 检查签名 secrets
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::error::缺少 ANDROID_KEYSTORE_BASE64，无法产出可安装的 APK。"
          echo "::error::请在仓库 Settings → Secrets and variables → Actions 配置："
          echo "::error::  ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD"
          echo "::error::  ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD"
          echo "::error::没有 keystore 就先跑 mobile/android/tools/new-keystore.ps1 生成一个。"
          exit 1

      # 落到 mobile/android/ 下，与 PHANTOM_KEYSTORE_PATH 的相对路径对应。
      # 该文件已被 .gitignore 覆盖，不会被误提交。
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/phantom-release.jks

      - name: 单元测试
        working-directory: mobile/android
        run: gradle --no-daemon testStandardReleaseUnitTest --stacktrace

      # 两个 flavor 都出正式签名包：
      #   dev      —— 自己人测试用，开发者选项可见，applicationId 带 .dev 后缀，
      #                可以和正式版并存装在同一台机器上
      #   standard —— 对外的正式版
      - name: 编译签名 release
        working-directory: mobile/android
        run: |
          gradle --no-daemon \
            assembleDevRelease assembleStandardRelease \
            -Pphantom.buildRustNative=${{ env.BUILD_RUST_NATIVE }} \
            --stacktrace

      - name: 清理签名密钥
        if: always()
        run: rm -f mobile/android/phantom-release.jks

      # 证明产物真的签上了。签名坏掉时 apksigner 会在这里失败，
      # 而不是等你传到手机上才看到「应用未安装」。
      - name: 校验签名
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          for apk in $(find mobile/android/app/build/outputs/apk -name '*.apk'); do
            echo "── $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: 收集产物
        run: |
          mkdir -p out
          find mobile/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          (cd out && sha256sum *.apk > SHA256SUMS) || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: phantom-android-dev
          path: out/
          if-no-files-found: error
          retention-days: 14
