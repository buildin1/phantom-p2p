name: Android (dev)

# 本地没有 Android 构建环境，编译验证全部在这里做。
# 只跑 android-dev 分支：main 上不该出现半成品的移动端提交。
on:
  workflow_dispatch:
  push:
    branches: [android-dev]
    paths:
      - mobile/android/**
      - crates/core/**
      - crates/mobile/**
      - crates/protocol/**
      - version.json
      - official.env
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/android-dev.yml
  pull_request:
    branches: [main]
    paths:
      - mobile/android/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 目前 crates/mobile 的导出面还没重做，先不构建原生库，
  # 让 UI 层的编译错误能独立暴露出来。等 FFI 落地后改成 true。
  BUILD_RUST_NATIVE: "false"

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-24.04
    env:
      # secrets 上下文在 step 的 if: 里读不到，必须先在 job 级映射成 env。
      # 没配签名 secrets 时这里是 'false'，release 相关步骤整段跳过。
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # 仓库里没有 gradle-wrapper.jar（二进制不入库），所以直接用
      # setup-gradle 提供的 gradle 命令，不走 ./gradlew。
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties

      - name: 准备 Rust 工具链
        if: env.BUILD_RUST_NATIVE == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: 安装 cargo-ndk 与 NDK
        if: env.BUILD_RUST_NATIVE == 'true'
        run: |
          sdkmanager "ndk;27.2.12479018"
          cargo install cargo-ndk --locked

      # debug 变体用 AGP 自动生成的 debug keystore 签名，产物可直接侧载安装。
      # release 未配签名时产出的是 unsigned APK，装不上，所以不在默认路径里构建。
      - name: 编译 debug
        working-directory: mobile/android
        run: |
          gradle --no-daemon \
            assembleDevDebug assembleStandardDebug \
            -Pphantom.buildRustNative=${{ env.BUILD_RUST_NATIVE }} \
            --stacktrace

      - name: 单元测试
        working-directory: mobile/android
        run: gradle --no-daemon testDevDebugUnitTest --stacktrace

      # 只有配齐了 secrets 才构建 release。没配就跳过，不产出装不上的未签名包。
      - name: 还原签名密钥
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/phantom-release.jks"

      - name: 编译签名 release
        if: env.HAS_SIGNING == 'true'
        working-directory: mobile/android
        env:
          PHANTOM_KEYSTORE_PATH: ${{ runner.temp }}/phantom-release.jks
          PHANTOM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PHANTOM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PHANTOM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleStandardRelease \
            -Pphantom.buildRustNative=${{ env.BUILD_RUST_NATIVE }} \
            --stacktrace

      - name: 清理签名密钥
        if: always() && env.HAS_SIGNING == 'true'
        run: rm -f "$RUNNER_TEMP/phantom-release.jks"

      - name: 收集产物
        run: |
          mkdir -p out
          find mobile/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          (cd out && sha256sum *.apk > SHA256SUMS) || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: phantom-android-dev
          path: out/
          if-no-files-found: error
          retention-days: 14
