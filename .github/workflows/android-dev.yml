name: Android (dev)

# 本地没有 Android 构建环境，编译验证全部在这里做。
# 只跑 android-dev 分支：main 上不该出现半成品的移动端提交。
on:
  workflow_dispatch:
  push:
    branches: [android-dev]
    paths:
      - mobile/android/**
      - crates/core/**
      - crates/mobile/**
      - crates/protocol/**
      - version.json
      - official.env
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/android-dev.yml
  pull_request:
    branches: [main]
    paths:
      - mobile/android/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 目前 crates/mobile 的导出面还没重做，先不构建原生库，
  # 让 UI 层的编译错误能独立暴露出来。等 FFI 落地后改成 true。
  BUILD_RUST_NATIVE: "false"

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-24.04
    env:
      # secrets 上下文在 step 的 if: 里读不到，必须先在 job 级映射成 env。
      # 没配签名 secrets 时这里是 'false'，release 相关步骤整段跳过。
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # 仓库里没有 gradle-wrapper.jar（二进制不入库），所以直接用
      # setup-gradle 提供的 gradle 命令，不走 ./gradlew。
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties

      - name: 准备 Rust 工具链
        if: env.BUILD_RUST_NATIVE == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: 安装 cargo-ndk 与 NDK
        if: env.BUILD_RUST_NATIVE == 'true'
        run: |
          sdkmanager "ndk;27.2.12479018"
          cargo install cargo-ndk --locked

      # 缺 secrets 就当场停，别让人跑完十分钟才发现产物装不上。
      - name: 检查签名 secrets
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::error::缺少 ANDROID_KEYSTORE_BASE64，无法产出可安装的 APK。"
          echo "::error::请在仓库 Settings → Secrets and variables → Actions 配置："
          echo "::error::  ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD"
          echo "::error::  ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD"
          echo "::error::没有 keystore 就先跑 mobile/android/tools/new-keystore.ps1 生成一个。"
          exit 1

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/phantom-release.jks"

      - name: 单元测试
        working-directory: mobile/android
        run: gradle --no-daemon testStandardReleaseUnitTest --stacktrace

      # 两个 flavor 都出正式签名包：
      #   dev      —— 自己人测试用，开发者选项可见，applicationId 带 .dev 后缀，
      #                可以和正式版并存装在同一台机器上
      #   standard —— 对外的正式版
      - name: 编译签名 release
        working-directory: mobile/android
        env:
          PHANTOM_KEYSTORE_PATH: ${{ runner.temp }}/phantom-release.jks
          PHANTOM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PHANTOM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PHANTOM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon \
            assembleDevRelease assembleStandardRelease \
            -Pphantom.buildRustNative=${{ env.BUILD_RUST_NATIVE }} \
            --stacktrace

      - name: 清理签名密钥
        if: always()
        run: rm -f "$RUNNER_TEMP/phantom-release.jks"

      # 证明产物真的签上了。签名坏掉时 apksigner 会在这里失败，
      # 而不是等你传到手机上才看到「应用未安装」。
      - name: 校验签名
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          for apk in $(find mobile/android/app/build/outputs/apk -name '*.apk'); do
            echo "── $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: 收集产物
        run: |
          mkdir -p out
          find mobile/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          (cd out && sha256sum *.apk > SHA256SUMS) || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: phantom-android-dev
          path: out/
          if-no-files-found: error
          retention-days: 14
