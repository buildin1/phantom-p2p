name: Build PhantomP2P

on:
  push:
    branches: [main]
    # 打 v* 标签触发发布：构建全部平台并自动发 GitHub Release
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台（all 将构建全部 PC 平台）"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-x64
          - windows-arm64
          - macos-x64
          - macos-arm64
          - linux-x64
          - linux-arm64

permissions:
  contents: read

env:
  PHANTOM_SKIP_VERSION_BUMP: "1"
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Frontend and Rust checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run build
      - run: npm run version:check
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --exclude phantom-p2p
      - run: cargo test --locked --workspace --exclude phantom-p2p

  windows-x64:
    name: Windows x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows-x64' }}
    runs-on: windows-2022
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes
      - name: Build Windows package
        shell: cmd
        run: build\build-windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-p2p-windows-x64
          path: build/release/windows/
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows-arm64' }}
    runs-on: windows-11-arm
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Download ARM64 runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wintun = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          Invoke-WebRequest 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $wintun
          Expand-Archive $wintun (Join-Path $env:RUNNER_TEMP 'wintun') -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'wintun\wintun\bin\arm64\wintun.dll') build\wintun.dll -Force
          $webview = Join-Path $env:RUNNER_TEMP 'webview2.zip'
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2792.45' -OutFile $webview
          Expand-Archive $webview (Join-Path $env:RUNNER_TEMP 'webview2') -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'webview2\runtimes\win-arm64\native\WebView2Loader.dll') build\WebView2Loader.dll -Force
      - name: Build frontend
        shell: pwsh
        run: npm ci; npm run build
      - name: Build ARM64 client and server
        shell: pwsh
        run: |
          cargo build --locked --release -p phantom-p2p
          cargo build --locked --release -p phantom-server
      - name: Stage ARM64 binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\release\windows-arm64 | Out-Null
          Copy-Item target\release\phantom-p2p.exe build\release\windows-arm64\
          Copy-Item target\release\phantom-server.exe build\release\windows-arm64\
          Copy-Item build\wintun.dll,build\WebView2Loader.dll build\release\windows-arm64\
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes
      - name: Build ARM64 NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node tools\version.mjs current
          if (-not $version) { throw "无法读取版本号" }
          $nsis = Join-Path ${env:PROGRAMFILES(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $nsis)) { $nsis = 'makensis.exe' }
          & $nsis -INPUTCHARSET UTF8 `
            -DSTAGING_DIR="$PWD\build\release\windows-arm64" `
            -DOUTPUT_DIR="$PWD\build\release\windows-arm64" `
            -DAPP_VERSION="$version" `
            build\windows-installer-arm64.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis 失败 (exit=$LASTEXITCODE)" }
      - name: Remove raw DLLs from the release folder
        shell: pwsh
        run: |
          # 发布包只留三个成品：exe、server、setup.exe。
          # wintun.dll 和 WebView2Loader.dll 已被 setup 打进安装器，
          # 不需要再以裸文件形式随发布包分发。
          Remove-Item build\release\windows-arm64\wintun.dll,build\release\windows-arm64\WebView2Loader.dll -Force
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-p2p-windows-arm64
          path: build/release/windows-arm64/
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || startsWith(inputs.platform, 'macos-') }}
    runs-on: ${{ matrix.runner }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.platform == 'all') && '[{"arch":"x64","target":"x86_64-apple-darwin","runner":"macos-15-intel"},{"arch":"arm64","target":"aarch64-apple-darwin","runner":"macos-15"}]' || inputs.platform == 'macos-x64' && '[{"arch":"x64","target":"x86_64-apple-darwin","runner":"macos-15-intel"}]' || '[{"arch":"arm64","target":"aarch64-apple-darwin","runner":"macos-15"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build frontend
        run: npm ci && npm run build
      - name: Build privileged TUN-provisioning helper (sidecar)
        run: |
          set -euxo pipefail
          cargo build --locked --release -p macos-helper --target ${{ matrix.target }}
          mkdir -p src-tauri/binaries
          cp "target/${{ matrix.target }}/release/macos-helper" \
             "src-tauri/binaries/phantom-macos-helper-${{ matrix.target }}"
      - name: Build app and server
        run: |
          npx tauri build --bundles app,dmg
          cargo build --locked --release -p phantom-server
      - name: Stage macOS artifacts
        run: |
          set -euxo pipefail
          out="build/release/macos-${{ matrix.arch }}"
          mkdir -p "$out"
          cp target/release/phantom-server "$out/"
          find target/release/bundle -type f -name '*.dmg' -exec cp {} "$out/" \;
          test -n "$(find "$out" -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-p2p-macos-${{ matrix.arch }}
          path: build/release/macos-${{ matrix.arch }}/
          if-no-files-found: error

  linux-x64:
    name: Linux x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-x64' }}
    runs-on: ubuntu-22.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux headless client and server
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config
          npm ci
          npm run build
          cargo build --locked --release -p phantom-p2p-web
          cargo build --locked --release -p phantom-server
          mkdir -p build/release/linux-x64
          cp target/release/phantom-p2p build/release/linux-x64/
          chmod +x build/release/linux-x64/phantom-p2p
          cp target/release/phantom-server build/release/linux-x64/
          chmod +x build/release/linux-x64/phantom-server
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-p2p-linux-x64
          path: build/release/linux-x64/
          if-no-files-found: error

  linux-arm64:
    name: Linux ARM64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-arm64' }}
    runs-on: ubuntu-22.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install ARM64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config
      - name: Build Linux ARM64 headless client and server
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          npm ci
          npm run build
          cargo build --locked --release --target aarch64-unknown-linux-gnu -p phantom-p2p-web
          cargo build --locked --release --target aarch64-unknown-linux-gnu -p phantom-server
          mkdir -p build/release/linux-arm64
          cp target/aarch64-unknown-linux-gnu/release/phantom-p2p build/release/linux-arm64/
          chmod +x build/release/linux-arm64/phantom-p2p
          cp target/aarch64-unknown-linux-gnu/release/phantom-server build/release/linux-arm64/
          chmod +x build/release/linux-arm64/phantom-server
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-p2p-linux-arm64
          path: build/release/linux-arm64/
          if-no-files-found: error

  # 发布：仅在 push v* tag 时运行。下载六个平台产物，
  # 按发布命名规范整理后创建 GitHub Release。
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, windows-arm64, macos, linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: phantom-p2p-windows-x64, path: dist/windows-x64 }
      - uses: actions/download-artifact@v4
        with: { name: phantom-p2p-windows-arm64, path: dist/windows-arm64 }
      - uses: actions/download-artifact@v4
        with: { name: phantom-p2p-macos-x64, path: dist/macos-x64 }
      - uses: actions/download-artifact@v4
        with: { name: phantom-p2p-macos-arm64, path: dist/macos-arm64 }
      - uses: actions/download-artifact@v4
        with: { name: phantom-p2p-linux-x64, path: dist/linux-x64 }
      - uses: actions/download-artifact@v4
        with: { name: phantom-p2p-linux-arm64, path: dist/linux-arm64 }

      - name: Stage release assets with canonical names
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p assets
          # 下载后的目录可能多包一层 artifact 名（download-artifact@v4 行为），
          # 用 find 递归定位文件，不依赖固定的目录深度。
          # Windows：setup 安装包保留原名，server 按平台标注
          cp "$(find dist/windows-x64 -name '*_setup.exe' | head -1)" assets/
          cp "$(find dist/windows-arm64 -name '*_setup.exe' | head -1)" assets/
          cp "$(find dist/windows-x64 -name 'phantom-server.exe' | head -1)" assets/phantom-server-x64.exe
          cp "$(find dist/windows-arm64 -name 'phantom-server.exe' | head -1)" assets/phantom-server-arm.exe

          # macOS：dmg 保留原名，server 标注架构
          cp "$(find dist/macos-x64 -name '*.dmg' | head -1)" assets/
          cp "$(find dist/macos-arm64 -name '*.dmg' | head -1)" assets/
          cp "$(find dist/macos-x64 -name 'phantom-server' -type f | head -1)" assets/phantom-server-macos-x64
          cp "$(find dist/macos-arm64 -name 'phantom-server' -type f | head -1)" assets/phantom-server-macos-arm
          chmod +x assets/phantom-server-macos-*

          # Linux：客户端与 server 都标注架构
          cp "$(find dist/linux-x64 -name 'phantom-p2p' -type f | head -1)" assets/phantom-p2p-linux-x64
          cp "$(find dist/linux-arm64 -name 'phantom-p2p' -type f | head -1)" assets/phantom-p2p-linux-arm
          cp "$(find dist/linux-x64 -name 'phantom-server' -type f | head -1)" assets/phantom-server-linux-x64
          cp "$(find dist/linux-arm64 -name 'phantom-server' -type f | head -1)" assets/phantom-server-linux-arm
          chmod +x assets/phantom-*-linux-*

          echo "=== 待发布资产 ==="
          ls -la assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NOTES="phantom-p2p $TAG 发布。请按平台选择对应文件，服务端单独部署（不包含在安装包内）。"
          gh release create "$TAG" assets/* --title "$TAG" --notes "$NOTES"
